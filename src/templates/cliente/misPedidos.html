<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Pedidos</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/cliente/misPedidos.css') }}">
</head>
<body>
    <div class="app">

        <!-- SIDEBAR -->
        <aside class="sidebar">
            <div class="logo-box">
                <h2>LavaSoft</h2>
            </div>
            <nav class="menu">
                <ul>
                    <li><a href="#">Mis Pedidos</a></li>
                    <li><a href="#" class="active">Actualizar datos</a></li>
                    <li><a href="#">Cerrar Sesión</a></li>
                </ul>
            </nav>
        </aside>

        <!-- CONTENIDO PRINCIPAL -->
        <div class="main">

            <!-- ENCABEZADO -->
            <header class="topbar">
                <div class="header-center">
                    <img src="{{ url_for('static', filename='img/logoo.jpeg') }}" class="icon-logo">
                    <h1>LavaExpress</h1>
                </div>
                <div class="header-right">
                    <div class="search-bar display-only">Mis Pedidos</div>
                </div>
            </header>

            <!-- BARRA DE BÚSQUEDA -->
                    <div class="search-container">
                        <div class="input-group search-box">
                            <span class="input-group-text"><i class="bi bi-search"></i></span>
                            <input type="text" class="form-control" placeholder="Buscar por ID o Fecha">
                        </div>
                    </div>

            <!-- CUERPO PRINCIPAL -->
            <main class="content">

                <div class="block catalogo-productos">
                    <h2>Mis Pedidos</h2>

                    <!-- TABLA DE PEDIDOS -->
                    <table class="table-catalogo">
                        <thead>
                            <tr>
                                <th>ID del Pedido</th>
                                <th>Fecha de Entrega Estimada</th>
                                <th>Estado del Pedido</th>
                                <th>Acción</th>
                            </tr>
                        </thead>
                        <tbody>
                            {% for pedido in pedidos %}
                            <tr>
                                <td>{{ pedido.id_pedido }}</td>
                                <td>{{ pedido.fecha_entrega_estimada }}</td>
                                <td>{{ pedido.estado }}</td>
                                <td class="acciones">
                                    <button class="btn-edit">✏️</button>
                                    <button class="btn-delete">🗑️</button>
                                </td>
                            </tr>
                            {% endfor %}
                        </tbody>
                    </table>
                </div>

            </main>
        </div>
    </div>
</body>
</html>
