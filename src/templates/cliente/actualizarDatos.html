<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Actualizar Datos</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/cliente/actualizarDatos.css') }}">
</head>
<body>
    <div class="app">

        <!-- SIDEBAR -->
        <aside class="sidebar">
            <div class="logo-box">
                <h2>LavaSoft</h2>
            </div>
            <nav class="menu">
                <ul>
                    <li><a href="#">Mis Pedidos</a></li>
                    <li><a href="#" class="active">Actualizar datos</a></li>
                    <li><a href="#">Cerrar Sesión</a></li>
                </ul>
            </nav>
        </aside>

        <!-- CONTENIDO PRINCIPAL -->
        <div class="main">

            <!-- ENCABEZADO -->
            <header class="topbar">
                <div class="header-center">
                    <img src="{{ url_for('static', filename='img/logoo.jpeg') }}" class="icon-logo">
                    <h1>LavaExpress</h1>
                </div>
                <div class="header-right">
                    <div class="display-only">Actualizar Datos</div>
                </div>
            </header>

            <!-- CUERPO PRINCIPAL -->
            <main class="content">

                <div class="update-container">

                    <!-- TITULO -->
                    <h2>Actualización de Datos</h2>

                    <!-- BOTONES DE SECCIÓN -->
                    <div class="section-buttons">
                        <button class="btn-section active" id="btn-personales">Datos Personales</button>
                        <button class="btn-section" id="btn-contrasena">Contraseña</button>
                    </div>

                    <!-- FORMULARIO DATOS PERSONALES -->
                    <div class="form-section" id="form-personales">
                        <label for="nombre">Nombre:</label>
                        <input type="text" id="nombre" placeholder="Tu nombre">

                        <label for="apellido">Apellido Paterno:</label>
                        <input type="text" id="apellido" placeholder="Tu apellido">

                        <label for="correo">Correo Electrónico:</label>
                        <input type="email" id="correo" placeholder="Tu correo">

                        <button class="btn btn-primary btn-update">Actualizar</button>
                    </div>

                    <!-- FORMULARIO CONTRASEÑA -->
                    <div class="form-section" id="form-contrasena" style="display:none;">
                        <label for="actual">Contraseña Actual:</label>
                        <input type="password" id="actual" placeholder="Contraseña actual">

                        <label for="nueva">Nueva Contraseña:</label>
                        <input type="password" id="nueva" placeholder="Nueva contraseña">

                        <button class="btn btn-primary btn-update">Actualizar</button>
                    </div>

                </div>

            </main>
        </div>
    </div>

    <!--Importar el JS-->
    <script src="{{ url_for('static', filename='js/cliente/actualizarDatos.js')}}"></script>
</body>
</html>
