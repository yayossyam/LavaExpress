<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Actualizar Datos</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/cliente/actualizarDatos.css') }}">
</head>
<body>
    <div class="app">

        <!-- SIDEBAR -->
        <aside class="sidebar">
            <div class="logo-box">
                <h2>LavaSoft</h2>
            </div>
            <nav class="menu">
                <ul>
                    <li><a href="{{ url_for('misPedidos') }}">Mis Pedidos</a></li>
                    <li><a href="{{ url_for('actualizarDatos') }}" class="active">Actualizar datos</a></li>
                    <li><a href="{{url_for('loggoutCliente')}}">Cerrar Sesión</a></li>
                </ul>
            </nav>
        </aside>

        <!-- CONTENIDO PRINCIPAL -->
        <div class="main">

            <!-- ENCABEZADO -->
            <header class="topbar">
                <div class="header-center">
                    <img src="{{ url_for('static', filename='img/logoo.jpeg') }}" class="icon-logo">
                    <h1>LavaExpress</h1>
                </div>
                <div class="header-right">
                    <div class="display-only">Actualizar Datos</div>
                </div>
            </header>

            <!-- CUERPO PRINCIPAL -->
            <main class="content">
                <div class="update-container">
                <!--ALERTAS-->
                    {% with messages = get_flashed_messages(with_categories=true) %}
                        {% if messages %}
                            {% for category, message in messages %}
                                <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
                                    {{ message }}
                                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                                </div>
                            {% endfor %}
                        {% endif %}
                    {% endwith %}

                    <h2>Actualización de Datos</h2>

                    <!-- BOTONES DE SECCIÓN -->
                    <div class="section-buttons">
                        <button class="btn-section active" id="btn-personales">Datos Personales</button>
                        <button class="btn-section" id="btn-contrasena">Contraseña</button>
                    </div>

                    <!-- FORMULARIO DATOS PERSONALES -->
                    <form id="form-personales" class="form-section" method="POST" action="{{ url_for('actualizarDatos') }}">
                        <label for="nombre">Nombre:</label>
                        <input type="text" id="nombre" name="nombre" placeholder="Tu nombre"
                            value="{{ usuario.NOMBRE }}" required>

                        <label for="apellido">Apellido Paterno:</label>
                        <input type="text" id="apellido" name="apellido" placeholder="Tu apellido"
                            value="{{ usuario.APATERNO }}" required>

                        <label for="correo">Correo Electrónico:</label>
                        <input type="email" id="correo" name="correo" placeholder="Tu correo"
                            value="{{ usuario.CORREO }}" required>

                        <button type="submit" class="btn btn-primary btn-update">Actualizar</button>
                    </form>

                    <!-- FORMULARIO CONTRASEÑA -->
                    <form id="form-contrasena" class="form-section" style="display:none;" method="POST" action="{{ url_for('actualizar_contrasena') }}">
                        <label for="actual">Contraseña Actual:</label>
                        <input type="password" id="actual" name="actual" placeholder="Tu contraseña actual" required>

                        <label for="nueva">Nueva Contraseña:</label>
                        <input type="password" id="nueva" name="nueva" placeholder="Nueva contraseña" required>

                        <button type="submit" class="btn btn-primary btn-update">Actualizar</button>
                    </form>

                </div>
            </main>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/cliente/actualizarDatos.js')}}"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
